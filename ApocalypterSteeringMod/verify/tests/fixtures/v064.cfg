[Drivetrain.Layout]

## Replace each vehicle's own drivetrain wiring with the Layout below (needs [Drivetrain] Enabled; follows the panel's Apply-to target). A vehicle the layout does not fit (missing axle/wheel) keeps its own drivetrain; the log says why.
# Setting type: Boolean
# Default value: false
Enabled = true

## Where the gearbox, transfer cases and differentials send torque. Statements separated by ';':
##   gearbox -> X              what the gearbox drives (a node or one wheel)
##   name: Type [k=v ...] -> A, B   a differential/transfer case with two outputs
## Type: Open, Locked, LSD. Keys: split (0-1, share of torque to A; Open diffs), stiffness (0-1, Locked/LSD), slip (LSD slip torque N·m, 0-5000), power / coast (LSD ramps, 0-1).
## Outputs: node names or wheels FL FR RL RR (first/last axle), A<n>L / A<n>R / A<n> (axle n from the front, centre wheel).
## Every node must be reachable from the gearbox and every node/wheel fed once; wheels not named are undriven.
## Each vehicle's own layout is written to the BepInEx log on first sight, ready to copy.
## Examples: RWD 'gearbox -> rear; rear: LSD -> RL, RR'  |  6x6 'gearbox -> transfer; transfer: Locked -> front, bogie; front: Open -> FL, FR; bogie: Locked -> mid, rear; mid: Open -> A2L, A2R; rear: Open -> RL, RR'.
# Setting type: String
# Default value: gearbox -> transfer; transfer: Open split=0.4 -> front, rear; front: Open -> FL, FR; rear: LSD -> RL, RR
Layout = gearbox -> rear; rear: LSD -> RL, RR

